const S={photo:"",authMode:"in",view:"landing",page:"dashboard",user:null,bm:new Set([3,6]),q:"",fs:"",fsem:"",ft:"",tab:"all",loading:false,sem:4};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
function toast(t,ok,act){document.querySelectorAll(".toast").forEach(x=>x.remove());const e=document.createElement("div");e.className="toast"+(ok?" ok":"");e.textContent=t;if(act){const b=document.createElement("button");b.textContent=act[0];b.dataset.page=act[1];e.appendChild(b)}document.body.appendChild(e);setTimeout(()=>e.remove(),3400)}
// Smart Study Search: parse natural language into filters + keywords
function parse(q){let s=" "+q.toLowerCase().replace(/[^a-z0-9 +&]/g," ")+" ",r={subject:"",sem:"",type:"",kw:[]};
 for(const k in ALIAS)if(ALIAS[k].some(a=>s.includes(" "+a+" "))){r.subject=k;ALIAS[k].forEach(a=>s=s.replace(" "+a+" "," "));break}
 let m=s.match(/\b(?:semester|sem)\s*(\d)/)||s.match(/\bs(\d)\b/)||s.match(/(\d)(?:st|nd|rd|th)?\s*(?:semester|sem)/);if(m){r.sem=+m[1];s=s.replace(m[0]," ")}
 for(const k in TALIAS){const a=TALIAS[k].find(a=>s.includes(" "+a+" "));if(a){r.type=k;s=s.replace(" "+a+" "," ");break}}
 const stop="give me show find get i need want for the a an of on in to please some all my with and about".split(" ");
 r.kw=s.split(/\s+/).filter(w=>w&&!stop.includes(w));return r}
function search(){const p=parse(S.q),eff=r=>({subject:S.fs||p.subject,sem:S.fsem||(r>1?"":p.sem),type:S.ft||(r>0?"":p.type)}),
 run=e=>mats.filter(m=>(!e.subject||m.subject==e.subject)&&(!e.sem||m.sem==e.sem)&&(!e.type||m.type==e.type)&&p.kw.every(w=>(m.title+" "+m.subject+" "+m.tags.join(" ")+" "+m.desc).toLowerCase().includes(w)));
 for(let r=0;r<3;r++){const l=run(eff(r));if(l.length||!S.q||r==2)return{l,e:eff(0),r:l.length?r:0}}}
function card(m,i=0){const b=S.bm.has(m.id);return `<div class="mc${S.hl==m.id?" hl":""}" data-open="${m.id}" tabindex="0" style="animation-delay:${i*40}ms"><div class="row"><span class="chip">${ICON[m.type]} ${m.type}</span><button class="bm" data-bm="${m.id}" title="Save for revision" aria-label="Save for revision">${b?"★":"☆"}</button></div><h4>${esc(m.title)}</h4><p>${esc(m.desc.slice(0,80))}${m.desc.length>80?"…":""}</p><div class="meta">${SHORT[m.subject]||m.subject} · Sem ${m.sem}${m.ok?' · <b class="vf">✓ Verified</b>':""}</div><div>${m.tags.slice(0,3).map(t=>`<span class="chip tg">#${esc(t)}</span>`).join(" ")}</div><div class="row meta"><span>by ${esc(m.by)} · ${fmt(m.date)}</span><span>⬇ ${m.pop}</span></div><button class="btn g sm" data-view="${m.id}">${m.type=="Video"||m.type=="Link"?"▶ Open":"⬇ View / Download"}</button></div>`}
const grid=(l,t="Nothing here yet",msg="Try another search or upload something new.",cta="")=>l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="empty"><div class="ic">📭</div><b>${t}</b><p>${msg}</p>${cta}</div>`;
const recent=()=>[...mats].sort((a,b)=>b.date.localeCompare(a.date));
const popular=()=>[...mats].sort((a,b)=>b.pop-a.pop);
const recommended=()=>mats.filter(m=>m.sem==S.sem&&!isMine(m)).sort((a,b)=>b.pop-a.pop);
function render(){const r=$("#root");document.body.classList.toggle("tch",S.view=="app"&&!!S.user&&S.user.role=="teacher");
 const bg=x=>`<div class="bgp"><img class="bgi" src="${CAMPUS}" alt=""><div class="bgo"></div>${x}</div>`;
 if(S.view=="landing")r.innerHTML=bg(landing());else if(S.view=="auth")r.innerHTML=bg(auth());else{r.innerHTML=shell();afterRender()}}
function landing(){return `<div class="wrap"><div class="nav"><div class="logo"><i>S</i>StudyHub</div><button class="btn g" data-go="auth">Log in</button></div>
<div class="hero"><span class="chip">🎓 Built for students</span><h1>Stop searching WhatsApp.<br><span>Start studying.</span></h1><p>StudyHub pulls every note, PDF, video and question paper from your scattered group chats into one searchable library.</p><button class="btn" style="font-size:17px;padding:14px 28px" data-go="auth">Get Started →</button></div>
</div>`}
